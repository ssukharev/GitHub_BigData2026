spring:
  application:
    name: collector            # application name in logs
  main:
    web-application-type: none # console application: no web server
  datasource:
    url: jdbc:postgresql://localhost:5432/ghanalytics   # overridden by SPRING_DATASOURCE_URL
    username: gha                                       # overridden by SPRING_DATASOURCE_USERNAME
    # no password here: it comes only from the SPRING_DATASOURCE_PASSWORD environment variable
  flyway:
    locations: classpath:db/migration                   # migrations from collector/core
    validate-migration-naming: true                     # a badly named migration is an error, not silence
